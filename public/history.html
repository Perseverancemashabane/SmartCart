<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartCart - My History</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .history-container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #93c5fd; text-decoration: none; margin-bottom: 20px; font-weight: 600; }
    .history-card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
    .history-header { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .history-date { color: #60a5fa; font-weight: 700; }
    .history-total { color: #10b981; font-weight: 700; font-size: 1.1rem; }
    .history-item { display: flex; justify-content: space-between; color: #cbd5e1; padding: 4px 0; font-size: 0.9rem; }
    .loading { text-align: center; color: #94a3b8; padding: 40px; }
  </style>
</head>
<body>
  <div class="history-container">
    <a href="/app.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Back to App
    </a>
    
    <h2 style="margin-bottom: 20px; font-size: 1.5rem;">My Shopping History</h2>
    
    <div id="history-list">
      <div class="loading">Loading your past trips...</div>
    </div>
  </div>

  <script>
    async function loadHistory() {
      const container = document.getElementById('history-list');
      try {
        const res = await fetch(`${window.location.origin}/api/customers/my-history`, { credentials: 'include' });
        const data = await res.json();

        if (data.success && data.history.length > 0) {
          container.innerHTML = data.history.map(trip => `
            <div class="history-card">
              <div class="history-header">
                <span class="history-date">${new Date(trip.date).toLocaleDateString('en-ZA', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
                <span class="history-total">R ${(trip.totalCents / 100).toFixed(2)}</span>
              </div>
              <div>
                ${trip.items.map(i => `
                  <div class="history-item">
                    <span>${i.quantity}x ${i.name}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<div class="loading">You have no past purchases yet.</div>';
        }
      } catch (err) {
        container.innerHTML = '<div class="loading" style="color: #f87171;">Failed to load history.</div>';
      }
    }
    
    loadHistory();
  </script>
</body>
</html>
