<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>SmartCart — Shopper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: #10b981;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }
    .section {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    /* Wallet Card */
    .wallet-card {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 16px;
      padding: 24px;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    }
    .wallet-label { font-size: 0.85rem; opacity: 0.9; margin-bottom: 8px; }
    .wallet-amount { font-size: 2.5rem; font-weight: 700; }

    /* Profile Info */
    .profile-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
    }
    .profile-row:last-child { border-bottom: none; }
    .profile-label { color: #94a3b8; }
    .profile-value { font-weight: 600; }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
      margin-top: 10px;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
    .btn-danger:hover { background: rgba(248,113,113,0.25); }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center; justify-content: center;
      padding: 20px;
      z-index: 2000;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      max-width: 480px; width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      border: 1px solid #334155;
    }
    .modal h3 { font-size: 1.2rem; margin-bottom: 16px; color: #f8fafc; }
    .history-trip {
      border-bottom: 1px solid #334155;
      padding: 12px 0;
    }
    .history-trip-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #60a5fa;
      margin-bottom: 6px;
    }
    .history-items {
      margin-left: 20px;
      color: #cbd5e1;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="brand-icon">🛒</div>
      <span>SmartCart Shopper</span>
    </div>
    <button class="btn btn-danger" style="width: auto; padding: 6px 12px; margin: 0;" id="logout-btn">Logout</button>
  </div>

  <div class="container">
    
    <!-- WALLET -->
    <div class="wallet-card">
      <div class="wallet-label">Wallet Balance</div>
      <div class="wallet-amount" id="wallet-balance">R 0.00</div>
    </div>

    <!-- PROFILE -->
    <div class="section">
      <div class="section-title"><span class="icon">👤</span> My Profile</div>
      <div class="profile-row">
        <div class="profile-label">Name</div>
        <div class="profile-value" id="profile-name">—</div>
      </div>
      <div class="profile-row">
        <div class="profile-label">Phone</div>
        <div class="profile-value" id="profile-phone">—</div>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="section">
      <div class="section-title"><span class="icon">⚡</span> Quick Actions</div>
      
      <!-- HISTORY BUTTON -->
      <button class="btn btn-primary" onclick="viewMyHistory()">
        📜 View Shopping History
      </button>
      
      <button class="btn btn-primary" style="background: #10b981;" onclick="window.location.href='/login.html'">
        🛒 Start Shopping
      </button>
    </div>

  </div>

  <!-- HISTORY MODAL -->
  <div class="modal-backdrop" id="history-modal">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>My Shopping History</h3>
        <button onclick="document.getElementById('history-modal').classList.remove('show')" style="background:none; border:none; color:#f87171; font-size:1.2rem; cursor:pointer;">✖</button>
      </div>
      
      <div id="history-content" style="margin-top: 16px;">
        <div style="text-align:center; padding:20px; color:#94a3b8;">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.origin;

    // ============================================================
    // Load User Data
    // ============================================================
    async function loadProfile() {
      try {
        const res = await fetch(`${API}/api/auth/me`, { credentials: 'include' });
        const data = await res.json();
        
        if (!data.authenticated || !data.customer) {
          window.location.href = '/login.html';
          return;
        }

        const customer = data.customer;
        document.getElementById('profile-name').textContent = customer.name || 'Customer';
        document.getElementById('profile-phone').textContent = customer.phoneNumber;
        
        // Fetch Wallet Balance
        const walletRes = await fetch(`${API}/api/wallet/balance`, { credentials: 'include' });
        const walletData = await walletRes.json();
        if (walletData.success) {
          document.getElementById('wallet-balance').textContent = `R ${(walletData.balanceCents / 100).toFixed(2)}`;
        }

      } catch (err) {
        console.error("Failed to load profile", err);
        window.location.href = '/login.html';
      }
    }

    // ============================================================
    // View History
    // ============================================================
    async function viewMyHistory() {
      const modal = document.getElementById('history-modal');
      const content = document.getElementById('history-content');
      
      modal.classList.add('show');
      content.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">Fetching your past trips...</div>';

      try {
        const res = await fetch(`${API}/api/customer/my-history`, { credentials: 'include' });
        const data = await res.json();

        if (data.success && data.history.length > 0) {
          content.innerHTML = data.history.map(trip => `
            <div class="history-trip">
              <div class="history-trip-header">
                <span>${new Date(trip.date).toLocaleDateString('en-ZA', { year: 'numeric', month: 'short', day: 'numeric' })}</span>
                <span>R ${(trip.totalCents / 100).toFixed(2)}</span>
              </div>
              <div class="history-items">
                <ul>
                  ${trip.items.map(i => `<li>${i.quantity}x ${i.name}</li>`).join('')}
                </ul>
              </div>
            </div>
          `).join('');
        } else {
          content.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">You have no past purchases yet.</div>';
        }
      } catch (err) {
        content.innerHTML = '<div style="text-align:center; color:#f87171; padding:20px;">Failed to load history.</div>';
      }
    }

    // ============================================================
    // Logout
    // ============================================================
    document.getElementById('logout-btn').addEventListener('click', async () => {
      try {
        await fetch(`${API}/api/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (e) { /* ignore */ }
      window.location.href = '/login.html';
    });

    // ============================================================
    // Boot
    // ============================================================
    loadProfile();

  </script>
</body>
</html>
